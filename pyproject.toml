[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "schednav"
version = "0.1.0.dev0"
description = "Trace-driven GPU scheduling simulation and bounded agent policy evaluation"
readme = "README.md"
keywords = ["gpu", "scheduling", "simulation", "agents", "research"]
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.urls]
Homepage = "https://github.com/Hai-qq/SchedNav"
Documentation = "https://github.com/Hai-qq/SchedNav/tree/main/docs"
Issues = "https://github.com/Hai-qq/SchedNav/issues"

[project.optional-dependencies]
forecast = [
  "chinese-calendar>=1.11,<2",
  "numpy>=1.26,<3",
  "torch>=2.4,<3",
]

[project.scripts]
schednav = "schednav.cli:main"
schednav-bridge = "schednav.host_bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
