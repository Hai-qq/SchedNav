<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc"><title id="title">SchedNav control flow</title><desc id="desc">Historical traces feed bounded policies, deterministic simulation, and SLO audit. Recommendations await human approval. Agents never place jobs on GPUs.</desc><rect width="960" height="260" rx="16" fill="#f3f6f3"/><g font-family="Arial, sans-serif"><text x="32" y="38" fill="#486365" font-size="12" letter-spacing="2">SCHEDNAV / DECISION BOUNDARY</text><g fill="#fff" stroke="#cbd8d3"><rect x="32" y="76" width="188" height="96" rx="10"/><rect x="268" y="76" width="188" height="96" rx="10"/><rect x="504" y="76" width="188" height="96" rx="10"/><rect x="740" y="76" width="188" height="96" rx="10"/></g><g fill="#193c41" font-size="19" font-weight="bold"><text x="48" y="111">Observe</text><text x="284" y="111">Propose</text><text x="520" y="111">Simulate</text><text x="756" y="111">Audit</text></g><g fill="#52686b" font-size="13"><text x="48" y="142">Trace + past state</text><text x="284" y="142">Bounded policy actions</text><text x="520" y="142">Deterministic placement</text><text x="756" y="142">Hard SLOs + ranking</text></g><g fill="none" stroke="#3f776a" stroke-width="2"><path d="M224 124h36m-7-6 7 6-7 6M460 124h36m-7-6 7 6-7 6M696 124h36m-7-6 7 6-7 6"/></g><text x="32" y="218" fill="#52686b" font-size="14">Agents choose policies. The simulator places jobs.</text><rect x="669" y="198" width="259" height="34" rx="17" fill="#173e42"/><text x="798" y="220" text-anchor="middle" fill="#d9f3e5" font-size="13">Recommendation → Human approval</text></g></svg>