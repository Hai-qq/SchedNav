name: first-party-contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SchedNav
        run: python -m pip install -e .
      - name: Check public repository boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\check_public_boundary.ps1
      - name: Run contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU forecast dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[forecast]"
      - name: Run contracts including optional forecast tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
