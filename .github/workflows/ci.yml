name: first-party-contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SchedNav
        run: python -m pip install -e .
      - name: Check public repository boundary
        run: python scripts/check_public_boundary.py
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic quickstart
        run: python examples/quickstart.py
      - name: Check PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\check_public_boundary.ps1

  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU forecast dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[forecast]"
      - name: Run contracts including optional forecast tests
        run: python -m unittest discover -s tests -v
